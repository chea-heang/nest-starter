packages:
  - '.'

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: false
  prisma: true
  unrs-resolver: false
  workerd: false

overrides:
  magic-string: '^0.30.17'
  ora: '^5.4.1'

peerDependencyRules:
  ignoreMissing:
    - '@nestjs/common'
    - '@nestjs/core'
    - 'keyv'
  allowedVersions:
    '@nestjs/common': '12.x'
    '@nestjs/core': '12.x'
