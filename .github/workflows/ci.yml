name: Continuous Integration (CI)

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, 'feat/**']
  workflow_dispatch:

jobs:
  validate:
    name: Lint, Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Code Quality & Lint Check
        run: pnpm run lint

      - name: Compile TypeScript & Build
        run: pnpm run build

      - name: Run Unit Tests
        run: pnpm test

  docker-check:
    name: Production Docker Build Smoke Test
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Production Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nest-starter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
