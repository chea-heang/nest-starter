name: Continuous Deployment (CD)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Run CI Validation Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint Check
        run: pnpm run lint

      - name: Build Application
        run: pnpm run build

      - name: Run Unit Tests
        run: pnpm test

  build-and-push:
    name: Build & Push to GHCR
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Image Repository for GHCR
        run: echo "GHCR_IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production Server
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Check Deployment Secrets Configuration
        id: check_secrets
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HEALTHCHECK_URL: ${{ secrets.API_HEALTHCHECK_URL }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "ssh_ready=true" >> $GITHUB_OUTPUT
            echo "✅ SSH deployment secrets detected."
          else
            echo "ssh_ready=false" >> $GITHUB_OUTPUT
            echo "ℹ️ SSH deployment secrets not yet configured. Skipping server restart step."
          fi

          if [ -n "$HEALTHCHECK_URL" ]; then
            echo "has_health_url=true" >> $GITHUB_OUTPUT
            echo "health_url=$HEALTHCHECK_URL" >> $GITHUB_OUTPUT
            echo "✅ Health check URL configured."
          else
            echo "has_health_url=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Health check URL not configured."
          fi

      - name: Execute Remote SSH Deployment
        if: steps.check_secrets.outputs.ssh_ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Deploying new image on production server..."
            cd /opt/nest-starter || cd ~/nest-starter
            
            # Authenticate with GHCR on server
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull latest production image
            docker compose -f docker-compose.prod.yml pull
            
            # Apply rolling restart / update
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Prune obsolete images to conserve server disk
            docker image prune -f
            echo "✅ Deployment completed successfully on server."

      - name: Post-Deployment Health Verification
        if: steps.check_secrets.outputs.ssh_ready == 'true' && steps.check_secrets.outputs.has_health_url == 'true'
        env:
          HEALTH_URL: ${{ steps.check_secrets.outputs.health_url }}
        run: |
          echo "🔍 Waiting for container to finish booting and running migrations..."
          sleep 15
          echo "Checking health endpoint at: $HEALTH_URL"
          curl -f --retry 5 --retry-delay 5 --retry-connrefused "$HEALTH_URL" || {
            echo "❌ Post-deployment health verification failed!"
            exit 1
          }
          echo "✅ Health check passed: API is actively serving requests."
